name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Created up front: parallel uploads would otherwise each create a release.
  release:
    runs-on: ubuntu-latest
    steps:
      - run: gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: node scripts/fetch-tectonic.mjs
      - run: npm run build
      - run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
